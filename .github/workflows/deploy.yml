name: Deploy

# Build once → push one immutable image → promote it dev → prod.
# Authentication: GitHub OIDC → Microsoft Entra workload identity federation (no stored secrets).
#
# One-time setup (see README "CI/CD"):
#   • Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME
#   • Environments "dev" and "production", each with variable AZURE_RESOURCE_GROUP
#   • "production" environment: required reviewers (manual approval) + branch protection to main

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'azure-pipelines.yml'
      - '.azure-pipelines/**'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token exchange with Entra ID
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deployment mid-flight

jobs:
  build-image:
    name: Build & push image
    # Skip cleanly (instead of failing) until the Azure variables above are configured.
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Compute image reference
        id: meta
        run: echo "image=${{ vars.ACR_NAME }}.azurecr.io/payroll-api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy → dev
    needs: build-image
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      parameter-file: infra/main.dev.bicepparam
      image: ${{ needs.build-image.outputs.image }}

  deploy-prod:
    name: Deploy → production
    needs: [build-image, deploy-dev]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production   # protected environment → waits for required reviewers
      parameter-file: infra/main.prod.bicepparam
      image: ${{ needs.build-image.outputs.image }}
