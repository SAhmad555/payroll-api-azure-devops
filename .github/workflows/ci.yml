name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PayrollApi.slnx

      - name: Build (warnings are errors)
        run: dotnet build PayrollApi.slnx --configuration Release --no-restore

      - name: Test (unit + integration) with coverage
        run: >
          dotnet test PayrollApi.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFilePrefix=results"
          --collect "XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;Cobertura;MarkdownSummaryGithub
          assemblyfilters: +Payroll.*;-Payroll.*Tests

      - name: Publish coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage-report/
          retention-days: 14

  container:
    name: Container build (no push)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image to validate the Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: payroll-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep:
    name: Bicep lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep templates (fails on errors, shows linter warnings)
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/registry.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.dev.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/main.prod.bicepparam --stdout > /dev/null
